name: Debug action
run-name: Debugging
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.3

      - name: Check what's going on with GCC
        working-directory: ./backend
        run: |
          cc --version | head -1
          echo | cc -dM -E - | grep -E '__(AVX2?|SSE2)__'
