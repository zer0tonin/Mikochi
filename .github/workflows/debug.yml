name: Debug action
run-name: Debugging
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.3

      - name: Set GOARCH/GOOS
        run: |
          echo "GOARCH=amd64" >> $GITHUB_ENV
          echo "GOAMD64=v1" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-march=x86-64" >> $GITHUB_ENV

      - name: Build backend and check output
        working-directory: ./backend
        run: |
          go build -v -o ./mikochi .
